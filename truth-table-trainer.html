<!--
  TRUTH TABLE TRAINER — LPS 31 / PHIL 31, Probability and Inductive Logic
  Kenny Easwaran, UC Irvine · k.easwaran@uci.edu
  Served from https://kennyeaswaran.github.io/lps31/

  WHAT THIS IS
  A drill for building truth tables by hand, covering every truth-table question type in
  the course. Self-contained: no dependencies, no network, no storage. Question types:

    · classify each sentence — tautology / contradiction / contingent
    · compare sentences     — which are equivalent, which mutually exclusive
    · test an argument      — valid or invalid, with the counterexample identified
    · the same first two for properties, using presence/absence (P/A) tables — week 3 only

  DESIGN PRINCIPLES
  The point is that the student does the work, so the program does as little of it as
  possible. Specifically:

  · The student states the row count before seeing a grid, and enumerates the rows.
  · ANY row ordering is accepted so long as every combination appears exactly once. A
    non-standard order is noted, not marked wrong, and every later column is then checked
    against the student's own ordering. Only genuine repeats are errors.
  · The student chooses which column to compute next. A column is available only once the
    columns it is built from are complete. This step does not exist on paper and is where
    most errors originate, so it is enforced rather than assumed.
  · Checking is ON DEMAND, per column — never live as the student types. Live validation
    lets a student brute-force a column by toggling until the red disappears.
  · Errors mark the offending cells and say how many, but never reveal the right values.

  ASSISTANCE TOGGLES
  Each one, when switched off, adds back a step the program had been doing. Students are
  meant to turn them off one at a time as they improve.

    auto-copy atomic letters   off → the student transcribes each atomic letter into its own
                                     columns, with the source reference column highlighted
    highlight legal columns    off → no green; every unfinished column stays clickable, and
                                     an illegal pick is explained rather than prevented
    highlight feeding columns  off → no blue; the student must see the structure unaided.
                                     (This hint appears only AFTER a column is chosen, so it
                                     never gives away the ordering — it counters the common
                                     error of recomputing from the atomic letters instead of
                                     from the immediately preceding subcolumns.)
    auto-highlight main conn.  off → an extra step: click the main connective of each
                                     sentence before reading anything off the table
    definition reminders       off → the definitions of tautology, equivalence, validity and
                                     so on are not shown. The validity step still REQUIRES
                                     the same row selections; it just stops saying what they
                                     are, which is the point.

  EXAM MODE
  Forces every toggle off and disables them. Two things distinguish it from simply
  unchecking everything:

  · Steps that are separate when guided happen together, because on paper they do. The
    whole table is filled at once, and for a validity question the verdict and the row
    selection are a single step.
  · Nothing is checked until submission, and each cell is then judged against WHAT THE
    STUDENT ACTUALLY WROTE in the cells feeding it, not against the correct table. A slip
    that is then propagated consistently upward is reported once, at its origin, rather
    than as a whole column of errors. See localExpect().

  VALIDITY, in detail
  The student first marks every row in which all the premises are true. The verdict then
  operates on that selection rather than replacing it: "valid" leaves it untouched, and
  "invalid" keeps those rows marked while the student picks out, from among them only, at
  least one row where the conclusion is false (shown in a second colour over the first).
  Rows outside the marked set are not selectable, since a row without every premise true
  cannot be a counterexample. Keeping one selection and refining it is what makes the
  logical structure visible.

  Colour key: yellow = column being filled · green = legal to compute next · blue = the
  columns feeding the current one · pink = main connective · purple = all premises true ·
  orange = counterexample · red = wrong.

  NOTATION
  Course conventions, which differ from standard math-stats usage: atomic sentences are
  lower-case letters, properties are capitals, connectives are & ∨ ∼. Input also accepts
  ~ for ∼ and v for ∨ — but only in binary-operator position, so v can still be an atomic
  letter. See norm().

  UNRESOLVED
  P/A classification uses "always present / never present / sometimes present" as the
  property analogues of tautology / contradiction / contingent. The course has no stated
  terminology for these, so this was invented and should be replaced with whatever wording
  is actually used in lecture. Change it in askClassify() and in Appendix A of the study
  guide together.

  MAINTENANCE
  Everything between the //---LOGIC--- markers is pure and DOM-free: lex, parse, ev, nodes
  and deps are the whole engine, and deps() drives both the column gating and the blue
  highlight. If you change any of it, re-check ev() against an independent evaluator before
  shipping — a trainer that marks correct answers wrong is worse than no trainer. This file
  is tested headlessly with jsdom: parser and evaluator over every sentence used in the
  course, plus an end-to-end walkthrough of all nine course problem sets in every mode and
  both main-connective toggle states.

  The design rationale is written up at greater length in Appendix C of
  LPS31-AI-study-guide.md, which also tells AI assistants how to build variants of this.
-->

<h2>Truth Table Trainer</h2>
<p class=sub>LPS 31 / PHIL 31 · Probability and Inductive Logic</p>

<p><label><b>Question type</b><br>
<select id=mode onchange=modeChanged()>
  <optgroup label="Sentences — truth tables (T/F)">
    <option value=cls>Classify each sentence — tautology, contradiction, or contingent</option>
    <option value=cmp>Compare sentences — which are equivalent, which mutually exclusive</option>
    <option value=val>Test an argument — is it deductively valid?</option>
  </optgroup>
  <optgroup label="Properties — presence/absence tables (week 3 only)">
    <option value=Pcmp>Compare properties — which are equivalent, which mutually exclusive</option>
    <option value=Pcls>Classify each property — always, never, or sometimes present</option>
  </optgroup>
</select></label></p>

<p><label id=lbl><b>Sentences</b>, one per line</label>
<textarea id=sents rows=4></textarea>
<select id=preset onchange="if(this.value){$('sents').value=this.value;this.selectedIndex=0;start()}"></select>
<button onclick=start()>Start</button></p>

<fieldset><legend>Assistance</legend>
<label><input type=checkbox id=autoCopy checked onchange=optChanged()> auto-copy atomic letters</label>
<label><input type=checkbox id=hint checked onchange=optChanged()> highlight columns I can compute next</label>
<label><input type=checkbox id=dep checked onchange=optChanged()> highlight the columns feeding the one I'm filling</label>
<label><input type=checkbox id=autoMain checked onchange=optChanged()> auto-highlight main connective</label>
<label><input type=checkbox id=defs checked onchange=optChanged()> definition reminders</label>
<label class=exam><input type=checkbox id=exam onchange=examChanged()> Exam mode — no help, no checking until the end</label>
</fieldset>

<div id=msg>Pick a question type, type some sentences or load a sample question, and press Start.
Write connectives as &amp; · ∨ (or v) · ∼ (or ~). Parentheses as usual.</div>
<div id=stage></div>
<div id=grid></div>
<div id=final></div>

<script>
//---LOGIC--- (pure functions; no DOM)
const NOT='∼',AND='&',OR='∨';
// lower-case v means "or" only in binary-operator position, so v can still be an atomic letter
// Accept the notations students may have met elsewhere: ~ ! ¬ - for ∼, ^ ∧ for &, | for ∨.
function norm(s){s=s.replace(/[~!¬-]/g,NOT).replace(/[|]/g,OR).replace(/[\^∧]/g,AND);
  let o='',prev='';
  for(let i=0;i<s.length;i++){let ch=s[i];
    if(ch==='v'){let j=i+1;while(s[j]===' ')j++;const nx=s[j]||'';
      if((prev===')'||/[A-Za-z]/.test(prev))&&(nx==='('||nx===NOT||/[A-Za-z]/.test(nx)))ch=OR;}
    o+=ch; if(ch!==' ')prev=ch;}
  return o;}
function lex(s){const o=[];for(const ch of norm(s)){if(ch===' ')continue;
  const k=ch===NOT?'not':ch===AND?'and':ch===OR?'or':ch==='('?'lp':ch===')'?'rp':/[A-Za-z]/.test(ch)?'atom':null;
  if(!k)throw Error('Unexpected character: '+ch); o.push({k,ch,col:o.length});}
  if(!o.length)throw Error('Empty sentence'); return o;}
function parse(ts){let i=0;const pk=()=>ts[i];
  function prim(){const t=ts[i];if(!t)throw Error('Sentence ends early');
    if(t.k==='not'){i++;return{k:'not',col:t.col,a:prim()};}
    if(t.k==='lp'){i++;const e=orx();if(!ts[i]||ts[i].k!=='rp')throw Error('Missing )');i++;return e;}
    if(t.k==='atom'){i++;return{k:'atom',col:t.col,ch:t.ch};}
    throw Error('Unexpected '+t.ch);}
  function andx(){let l=prim();while(pk()&&pk().k==='and'){const t=ts[i++];l={k:'and',col:t.col,a:l,b:prim()};}return l;}
  function orx(){let l=andx();while(pk()&&pk().k==='or'){const t=ts[i++];l={k:'or',col:t.col,a:l,b:andx()};}return l;}
  const e=orx(); if(i!==ts.length)throw Error('Unexpected '+ts[i].ch); return e;}
function ev(n,e){return n.k==='atom'?e[n.ch]:n.k==='not'?!ev(n.a,e):n.k==='and'?(ev(n.a,e)&&ev(n.b,e)):(ev(n.a,e)||ev(n.b,e));}
function nodes(n,a=[]){if(n.k!=='atom'){nodes(n.a,a);if(n.b)nodes(n.b,a);}a.push(n);return a;}
function deps(n){return n.k==='atom'?[]:n.b?[n.a.col,n.b.col]:[n.a.col];}
function atomsOf(s){const o=[];for(const t of lex(s))if(t.k==='atom'&&!o.includes(t.ch))o.push(t.ch);return o;}
function mkRows(as){const n=as.length,o=[];for(let i=0;i<2**n;i++){const e={};as.forEach((a,k)=>e[a]=!((i>>(n-1-k))&1));o.push(e);}return o;}
function relation(u,v){const eq=u.every((x,i)=>x===v[i]),me=!u.some((x,i)=>x&&v[i]);
  return eq?'equivalent':me?'exclusive':'neither';}
function classify(col){return col.every(Boolean)?'taut':col.some(Boolean)?'cont':'contra';}
function premRows(cols,nPrem){const out=[];for(let r=0;r<cols[0].length;r++){
  let all=true;for(let i=0;i<nPrem;i++)if(!cols[i][r])all=false;if(all)out.push(r);}return out;}
function counterexamples(cols,nPrem){return premRows(cols,nPrem).filter(r=>!cols[nPrem][r]);}
//---/LOGIC---

const PRE={
 cls:[["Sample question like Homework 1, Problem 2","∼(a & ∼(a & b))\n∼(a & a) & b\n∼(a ∨ (b ∨ a))\na & ∼(a ∨ b)"],
      ["Sample question like Midterm 1, Problem 1","m & ∼(m ∨ n)\n(m & ∼m) ∨ n\nm ∨ (∼m ∨ ∼n)\n(m & n) ∨ (∼m & n)"],
      ["A single sentence, to start","∼(a & ∼(a & b))"]],
 cmp:[["Sample question like Homework 1, Problem 3","e ∨ ∼g\n∼(g & ∼e)\n∼e & g\n∼e ∨ ∼g"],
      ["Sample question like Midterm 1, Problem 2 (8 rows)","∼e ∨ (f & ∼g)\n∼(e & (∼f ∨ g))\n(e ∨ f) & (e ∨ g)\n∼e & (∼f ∨ g)"],
      ["Just two sentences, to start","e ∨ ∼g\n∼(g & ∼e)"]],
 val:[["Sample question like Homework 1, Problem 4","f ∨ g\n∼(f & k)\ng ∨ ∼k"],
      ["Sample question like Midterm 1, Problem 3","p ∨ ∼q\n∼p & ∼(q & ∼p)\nq"],
      ["Sample question like the Final, Problem 1","r & (s ∨ t)\nr & ∼s\nt"]],
 Pcmp:[["Sample question like Homework 2, Problem 1","D ∨ ∼E\n∼D & E\n∼(D & E)\n∼D ∨ ∼E"]],
 Pcls:[["Sample question — the same four properties","D ∨ ∼E\n∼D & E\n∼(D & E)\n∼D ∨ ∼E"]]};
const LBL={cls:"<b>Sentences</b>, one per line",cmp:"<b>Sentences</b>, one per line",
 val:"<b>The argument</b> — one premise per line, <b>conclusion last</b>",
 Pcmp:"<b>Properties</b>, one per line (capital letters)",Pcls:"<b>Properties</b>, one per line (capital letters)"};
const OPTS=['autoCopy','hint','dep','autoMain','defs'];

let S={};
const $=id=>document.getElementById(id);
const on=id=>$(id).checked;
const msg=(t,kind)=>{const m=$('msg');m.className='';void m.offsetWidth;m.className=kind||'';m.textContent=t;};
const kind=()=>S.mode.replace('P','');
const R=()=>S.rows?S.rows.length:S.nRows;
function defn(html){return on('defs')?`<div class=defn>${html}</div>`:'';}

function examChanged(){
  const e=on('exam');
  OPTS.forEach(o=>{const b=$(o);if(e){b.dataset.was=b.checked?'1':'';b.checked=false;}else if(b.dataset.was!==undefined)b.checked=b.dataset.was==='1';
    b.disabled=e; b.parentNode.classList.toggle('off',e);});
  if(S.sents)start();
}
function optChanged(){ if(S.sents&&(S.stage==='rows'||S.stage==='atoms'))start(); else if(S.sents)draw(); }
function modeChanged(){
  const m=$('mode').value;
  $('lbl').innerHTML=LBL[m];
  $('preset').innerHTML='<option value="">— load a sample assignment question —</option>'
    +PRE[m].map(([n,v])=>`<option value="${v.replace(/\n/g,'&#10;')}">${n}</option>`).join('');
  $('sents').value='';$('grid').innerHTML='';$('stage').innerHTML='';$('final').innerHTML='';
  S={};msg('Type some '+(m[0]==='P'?'properties':'sentences')+', or load a sample question, and press Start.');
}

function start(){
  const mode=$('mode').value,pa=mode[0]==='P',k=mode.replace('P','');
  const src=$('sents').value.split('\n').map(x=>x.trim()).filter(Boolean);
  try{
    if(!src.length)throw Error('Enter at least one '+(pa?'property':'sentence')+'.');
    if(k==='val'&&src.length<2)throw Error('An argument needs at least one premise and a conclusion — put the conclusion on the last line.');
    if(k==='cmp'&&src.length<2)throw Error('Comparing needs at least two.');
    if(src.length>5)throw Error('Five at a time is plenty.');
    const as=[];src.forEach(s=>atomsOf(s).forEach(a=>{if(!as.includes(a))as.push(a);}));
    if(as.length>4)throw Error(`That needs ${2**as.length} rows (${as.length} letters). Four letters is the sensible maximum here.`);
    if(pa&&as.some(a=>a===a.toLowerCase()))throw Error('Properties are written with capital letters.');
    if(!pa&&as.some(a=>a===a.toUpperCase()))throw Error('Sentences are written with lower-case letters.');
    S={mode,pa,exam:on('exam'),T:pa?'P':'T',F:pa?'A':'F',as,sents:[],cols:{},filled:new Set(),
       act:null,marked:new Set(),sets:[],mains:new Set(),stage:'rows'};
    let base=0;
    src.forEach((s,i)=>{
      const ts=lex(s),ast=parse(lex(s)),byCol={};
      nodes(ast).forEach(n=>byCol[n.col]=n);
      const label=k==='val'?(i<src.length-1?'Premise '+(i+1):'Conclusion'):src.length>1?'('+'abcde'[i]+')':'';
      S.sents.push({src:s,ts,ast,byCol,base,label});
      Object.keys(byCol).forEach(c=>S.cols[base+ +c]={node:byCol[c],si:i});
      base+=ts.length;});
    S.rows=null;S.nRows=2**as.length;
    $('grid').innerHTML='';$('final').innerHTML='';askRows();
  }catch(e){msg(e.message,'err');}
}
function askRows(){
  const n=S.as.length;
  $('stage').innerHTML=`<b>Step 1.</b> ${n} atomic ${S.pa?(n>1?'properties':'property'):(n>1?'sentences':'sentence')}
    (${S.as.join(', ')})${S.sents.length>1?' across all of them':''}. How many rows does the table need?
    <input type=text id=nr size=4> <button onclick=chkRows()>${S.exam?'Next step':'Check'}</button>`;
  msg('Step 1: how many rows?');
}
function chkRows(){
  const v=+$('nr').value;
  if(S.exam){
    if(!(v>0&&v<=16))return msg('Enter a number of rows between 1 and 16.','err');
    S.nRows=v;S.rows=null;S.stage='free';$('stage').innerHTML='';draw();
    return msg('Fill in the whole table — the columns under the atomic letters on the left, then every column of every sentence. Nothing is checked until you submit.');
  }
  if(v!==2**S.as.length)
    return msg(`Not quite — ${$('nr').value} isn't right. Each row is one combination of ${S.T} and ${S.F} across ${S.as.length} letter${S.as.length>1?'s':''}. How many combinations are there?`,'err');
  S.nRows=v;S.stage='atoms';$('stage').innerHTML='';draw();
  msg(`Step 2: fill the ${S.as.length} left-hand column${S.as.length>1?'s':''} so every combination appears exactly once.\nType ${S.T} or ${S.F}; the cursor moves down. Then press Check.`);
}

// ---- table ----
function clickable(g){return !!S.cols[g]&&!S.filled.has(g)&&S.stage==='pick';}
function canDo(g){const{node,si}=S.cols[g],b=S.sents[si].base;
  return clickable(g)&&deps(node).every(d=>S.filled.has(b+d));}
function depCols(){
  if(S.stage!=='fill'||S.act===null||!on('dep'))return[];
  const{node,si}=S.cols[S.act],b=S.sents[si].base;
  if(node.k==='atom')return['a'+S.as.indexOf(node.ch)];   // its source is the reference column
  return deps(node).map(d=>b+d);}
function mainCols(){return S.sents.map(s=>s.base+s.ast.col);}
// which main-connective columns are shown in pink: all of them when the highlight is automatic,
// otherwise the ones the student has picked out so far — same colour either way
function mainSet(){
  if(!['main','final','prem','verdict','ce','sel','examval','done'].includes(S.stage))return[];
  return on('autoMain')?mainCols():[...S.mains];}
function draw(){
  const dep=depCols(),multi=S.sents.length>1,mset=mainSet();
  let lab='';
  if(multi)lab=`<tr><th colspan=${S.as.length}></th>`+S.sents.map((s,i)=>
    `<th class="lab sep" colspan=${s.ts.length}>${S.stage==='sel'&&S.selKind?`<input type=checkbox id=sel${i} onchange=draw2()${S.selPick&&S.selPick.has(i)?' checked':''}> `:''}${s.label}</th>`).join('')+'</tr>';
  let hdr=S.as.map(a=>`<th>${a}</th>`).join('');
  S.sents.forEach(s=>s.ts.forEach(t=>{
    const g=s.base+t.col,clk=clickable(g);
    const cl=S.act===g?'act':dep.includes(g)?'dep':mset.includes(g)?'main'
            :S.stage==='main'&&S.cols[g]?'pk':S.filled.has(g)?'done'
            :(S.cols[g]&&canDo(g)&&on('hint'))?'avail pk':clk?'pk':'';
    const click=S.stage==='main'&&S.cols[g]?`onclick=pickMain(${g})`:clk?`onclick=pick(${g})`:'';
    hdr+=`<th class="${cl}${t.col===0?' sep':''}" ${click}>${t.ch}</th>`;}));
  let body='';
  for(let r=0;r<R();r++){
    // in the counterexample step only the already-marked rows are live
    const rc=(S.stage==='prem'||S.stage==='examval'||(S.stage==='ce'&&S.marked.has(r)))?'rowpick ':'';
    body+=`<tr class="${rc}${S.marked.has(r)?'marked ':''}${S.ceMarked&&S.ceMarked.has(r)?'cesel ':''}" ${rc?`onclick=rowClick(${r})`:''}>`
      +S.as.map((a,k)=>cell('a'+k,r)).join('')
      +S.sents.map(s=>s.ts.map(t=>t.k==='lp'||t.k==='rp'?`<td${t.col===0?' class=sep':''}></td>`
          :cell(s.base+t.col,r,t.col===0,mset.includes(s.base+t.col))).join('')).join('')+'</tr>';}
  $('grid').innerHTML=`<table class="tt ${S.stage==='done'?'win':''}">${lab}<tr>${hdr}</tr>${body}</table>`+btns();
  const f=document.querySelector('input.c:not([readonly])');if(f)f.focus();
}
function draw2(){ // remember checkbox state across a redraw
  S.selPick=new Set();S.sents.forEach((s,i)=>{const b=$('sel'+i);if(b&&b.checked)S.selPick.add(i);});
  $('final').innerHTML=selPanel();}
function cell(c,r,sep,isMain){
  const key=c+'|'+r,v=S[key]||'',num=typeof c==='number';

  const clk=num&&clickable(c);

  const cl=(sep?'sep ':'')+(S['bad'+key]?'bad ':'')+(clk||mainPick?'pk ':'')+(isMain?'mainc ':'')
    +(depCols().includes(c)?'dep ':'')+(clk&&canDo(c)&&on('hint')?'av':'');
  const click=mainPick?`onclick=pickMain(${c})`:clk?`onclick=pick(${c})`:'';
  return `<td class="${cl.trim()}" ${click}><input class=c data-c="${c}" data-r="${r}" value="${v}" ${ro?'readonly':''} onkeydown="key(event)" oninput="typed(this)"></td>`;
}
function btns(){
  if(S.stage==='free')return '<button onclick=examNext()>Next step</button>';
  if(S.stage==='atoms')return '<button onclick=chkAtoms()>Check these columns</button>';
  if(S.stage==='fill')return '<button onclick=chkCol()>Check this column</button> <button onclick="S.act=null;S.stage=\'pick\';draw()">Pick a different column</button>';
  if(S.stage==='pick')return '<span class=hint>Click any cell in a column to compute that column next.</span>';
  if(S.stage==='main')return '<span class=hint>Click anywhere in the column under the main connective of '+(S.sents[S.mainI].label||'the sentence')+'.</span>';
  if(S.stage==='prem')return '<button onclick=chkPrem()>Check these rows</button>';
  if(S.stage==='ce')return '<button onclick=chkCE()>Check</button>'
    +'<div class=key><span class=sw style="background:#e8dcff"></span>every premise true'
    +' &nbsp; <span class=sw style="background:#ffc98c"></span>your counterexample</div>';

}
function key(e){const i=e.target,c=i.dataset.c,r=+i.dataset.r;
  const mv=d=>{const n=document.querySelector(`input[data-c="${c}"][data-r="${r+d}"]`);if(n){n.focus();n.select();}};
  if(e.key==='ArrowDown'){mv(1);e.preventDefault();}else if(e.key==='ArrowUp'){mv(-1);e.preventDefault();}
  else if(e.key===' '){const v=i.value.toUpperCase();i.value=v===S.T?S.F:S.T;typed(i);e.preventDefault();}}
function typed(i){const v=i.value.toUpperCase().slice(-1),c=i.dataset.c,r=+i.dataset.r;
  if(v!==S.T&&v!==S.F){i.value='';delete S[c+'|'+r];return;}
  i.value=v;S[c+'|'+r]=v;delete S['bad'+c+'|'+r];i.parentNode.classList.remove('bad');
  const n=document.querySelector(`input[data-c="${c}"][data-r="${r+1}"]`);if(n){n.focus();n.select();}}

// ---- step 2: the rows ----
function readRows(){
  const got=[];
  for(let r=0;r<R();r++){const row=S.as.map((a,k)=>S['a'+k+'|'+r]||'');
    if(row.some(x=>!x))return null;got.push(row.join(''));}
  return got;}
function chkAtoms(){
  const got=readRows();
  if(!got)return msg('Fill in every cell in these columns first.','err');
  const first={},dup=new Set();
  got.forEach((s,r)=>{if(first[s]===undefined)first[s]=r;else{dup.add(r);dup.add(first[s]);}});
  if(dup.size){dup.forEach(r=>S.as.forEach((a,k)=>S['bada'+k+'|'+r]=1));draw();
    return msg(`Some combinations appear more than once — the marked rows repeat each other, so the same number must be missing. With ${S.as.length} atomic letters there are exactly ${2**S.as.length}, each appearing once.\n\nA systematic order makes this impossible to get wrong: ${S.T} above ${S.F}, the leftmost column switching once halfway down, the next twice, each after that twice as often.`,'err');}
  S.rows=got.map(s=>{const e={};S.as.forEach((a,k)=>e[a]=s[k]===S.T);return e;});
  const canon=mkRows(S.as).map(e=>S.as.map(a=>e[a]?S.T:S.F).join('')),std=canon.every((s,i)=>s===got[i]);
  let note=std?'Rows are right, in the standard order.'
    :`Accepted — all ${got.length} combinations are there exactly once, so the table is complete and correct. It is not the usual order, but nothing is wrong with that; ordering systematically just makes it harder to repeat or miss a combination. The rest of the table is checked against the order you used.`;
  if(on('autoCopy')){
    S.sents.forEach(s=>s.ts.forEach(t=>{if(t.k==='atom'){const g=s.base+t.col;S.filled.add(g);
      S.rows.forEach((env,r)=>S[g+'|'+r]=env[t.ch]?S.T:S.F);}}));
    note+='\n\nColumns under the atomic letters are copied across for you.';
  }else note+='\n\nNow copy each atomic letter into its own columns yourself, then work outwards. Those columns come first.';
  if(S.sents.every(s=>S.filled.has(s.base+s.ast.col)))return afterColumns();
  S.stage='pick';draw();
  msg(note+'\n\nStep 3: which column can you compute next? A column can be computed only once the columns it is built from are done.'
    +(S.sents.length>1?' You can work across the '+(S.pa?'properties':'sentences')+' in any order.':''));
}

// ---- step 3: the columns ----
function pick(g){
  if(!clickable(g))return;
  if(!canDo(g))return msg("Not yet — that column is built from a subsentence you haven't computed. Look for a connective whose parts are already filled in, and work outwards from there.",'err');
  S.act=g;S.stage='fill';draw();
  const{node:n,si}=S.cols[g],s=S.sents[si];
  if(n.k==='atom')return msg(`Copying the atomic ${S.pa?'property':'sentence'} ${n.ch} into this column`+(s.label?` (${s.label})`:'')
    +`.\n${on('dep')?'It comes straight from the blue reference column on the left. ':''}Type ${S.T}/${S.F} down the column, then Check.`);
  const ns=nodes(n).map(x=>x.col),sub=s.ts.slice(Math.min(...ns),Math.max(...ns)+1).map(t=>t.ch).join('');
  const dp=deps(n),plural=dp.length>1?'s':'',atomic=dp.every(x=>s.byCol[x].k==='atom');
  msg(`Computing the column under this ${n.k==='not'?NOT:n.k===AND?'&':OR} — the value of ${sub} in each row`+(s.label?` (${s.label})`:'')+`.\n`
    +(on('dep')?`Work from the blue column${plural}${atomic?'':', not from the atomic letters'}. `:'')
    +`Type ${S.T}/${S.F} down the column, then Check.`);
}
function chkCol(){
  const g=S.act,{node:n}=S.cols[g];let bad=0;
  S.rows.forEach((env,r)=>{if(S[g+'|'+r]!==(ev(n,env)?S.T:S.F)){bad++;S['bad'+g+'|'+r]=1;}});
  if(bad){draw();return msg(`${bad} row${bad>1?'s':''} not right — marked. `
    +(n.k==='atom'?'Copy the values straight down from the reference column on the left.'
     :"Check those rows against the columns this one is built from; don't recompute from the atomic letters."),'err');}
  S.filled.add(g);S.act=null;
  if(S.sents.every(s=>S.filled.has(s.base+s.ast.col)))return afterColumns();
  S.stage='pick';draw();
  const left=Object.keys(S.cols).filter(c=>!S.filled.has(+c)).length;
  msg(`Correct. ${left} column${left>1?'s':''} to go. Which one next?`);
}

// ---- main-connective step ----
function afterColumns(){
  if(on('autoMain')||S.exam)return startFinal();
  S.mainI=0;S.stage='main';draw();
  msg(`The table is complete. Before reading anything off it: click the column under the main connective of ${S.sents[0].label||'the sentence'} — the one whose column gives the value of the whole ${S.pa?'property':'sentence'}.`);
}
function pickMain(g){
  const want=S.sents[S.mainI].base+S.sents[S.mainI].ast.col;
  if(g!==want)return msg('That is the main connective of a part, not of the whole. The main connective is the last one you computed — the one every other column feeds into.','err');
  S.mains.add(g);S.mainI++;
  if(S.mainI>=S.sents.length){S.mains=new Set(mainCols());return startFinal();}
  draw();msg(`Right. Now the main connective of ${S.sents[S.mainI].label||''}.`);
}

// ---- final questions ----
function colOf(i){const s=S.sents[i];return S.rows.map((e,r)=>S[(s.base+s.ast.col)+'|'+r]===S.T);}
function startFinal(){
  if(kind()==='val'){S.marked=new Set();S.stage='prem';draw();$('final').innerHTML='';
    return msg('Step 4: '+(on('defs')
      ?'click every row in which ALL the premises are true. Ignore the conclusion for now.'
      :'mark the rows you need in order to decide whether this argument is valid.')
      +(on('defs')?'':'')); }

  return kind()==='cmp'?askCompare():askClassify();
}
// -- classify --
function askClassify(){
  const opts=S.pa?[['taut','always present'],['contra','never present'],['cont','sometimes present']]
                 :[['taut','tautology'],['contra','contradiction'],['cont','contingent']];
  $('final').innerHTML='<b>Step 4.</b> Read each main-connective column:<br>'
    +defn(S.pa?`<b>Always present</b> — ${S.T} in every row. <b>Never present</b> — ${S.F} in every row. <b>Sometimes present</b> — ${S.T} in at least one row and ${S.F} in at least one row.`
              :`A <b>tautology</b> is true in every row. A <b>contradiction</b> is false in every row. A sentence is <b>contingent</b> if it is true in at least one row and false in at least one row.`)
    +S.sents.map((s,i)=>`<div class=q><code>${s.src}</code>
      <select id=f${i}><option value="">choose…</option>${opts.map(([v,t])=>`<option value=${v}>${t}</option>`).join('')}</select></div>`).join('')
    +`<button onclick=${S.exam?'examSubmit()':'chkClassify()'}>${S.exam?'Submit':'Check'}</button>`;

}
function chkClassify(){
  const wrong=[];

    if(!g)return wrong.push(s.src+' (not answered)');
    if(g!==classify(colOf(i)))wrong.push(s.src);});
  if(wrong.length)return msg(`Not right for: ${wrong.join(', ')}.\nLook only at the column under the main connective of each.`,'err');
  finish('Every one classified correctly.');
}
// -- compare --
function relOf(i,j){return relation(colOf(i),colOf(j));}
function trueSets(){ // every pair that stands in each relation
  const eq=[],ex=[];
  for(let i=0;i<S.sents.length;i++)for(let j=i+1;j<S.sents.length;j++){
    const r=relOf(i,j);if(r==='equivalent')eq.push(i+','+j);if(r==='exclusive')ex.push(i+','+j);}
  return{eq,ex};}
function covered(){ // pairs the student has claimed, via the sets submitted so far
  const eq=new Set(),ex=new Set();
  S.sets.forEach(({kind,ids})=>{for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){
    const key=Math.min(ids[a],ids[b])+','+Math.max(ids[a],ids[b]);
    (kind==='equivalent'?eq:ex).add(key);}});
  return{eq,ex};}
function selPanel(){
  const list=S.sets.length?'<div class=found><b>Recorded so far:</b><br>'+S.sets.map(({kind,ids})=>
      `&nbsp;&nbsp;${kind==='equivalent'?'equivalent':'mutually exclusive'}: ${ids.map(i=>S.sents[i].label).join(' , ')}`).join('<br>')+'</div>':'';
  const legend='<div class=hint>'+S.sents.map((s,i)=>`${s.label} <code>${s.src}</code>`).join(' &nbsp; ')+'</div>';
  if(S.selKind){
    const n=S.selPick?S.selPick.size:0;
    return legend+list+`<p>Tick the ${S.pa?'properties':'sentences'} that are <b>${S.selKind==='equivalent'?'equivalent to each other':'mutually exclusive with each other'}</b> — the checkboxes are in the table heading.<br>
      <button onclick=setDone()>Done with this set</button>
      <button onclick="S.selKind=null;S.selPick=null;draw();$('final').innerHTML=selPanel()">Cancel</button>

function askCompare(){

function selStart(k){S.selKind=k;S.selPick=new Set();draw();$('final').innerHTML=selPanel();}

// -- validity --
function rowClick(r){

function chkPrem(){
  const cols=S.sents.map((s,i)=>colOf(i)),n=S.sents.length-1,want=new Set(premRows(cols,n));

function verdict(v){

function chkCE(){

// ---- exam mode ----
function examNext(){
  if(S.stage==='free'){
    const got=readRows();
    if(!got)return msg('Fill in the left-hand columns before going on.','err');
    S.rows=got.map(s=>{const e={};S.as.forEach((a,k)=>e[a]=s[k]===S.T);return e;});
    if(kind()==='val'){S.marked=new Set();S.claim=undefined;S.stage='examval';draw();examPanel();
      return msg('Give your verdict, and mark the rows that justify it. Both at once; nothing is checked until you submit.');}
    S.stage=kind()==='cmp'?'sel':'final';draw();
    return kind()==='cmp'?askCompare():askClassify();}
}
// exam mode: verdict and row selection are one step, checked only at submission
function examPanel(){
  $('final').innerHTML='<b>Verdict.</b> '
    +`<button class="${S.claim===true?'sel':''}" onclick="examVerdict(true)">Valid</button> `
    +`<button class="${S.claim===false?'sel':''}" onclick="examVerdict(false)">Invalid</button> `
    +`<button onclick=examSubmit()>Submit</button>`
    +`<div class=key>${S.marked.size} row${S.marked.size===1?'':'s'} marked</div>`;
}
function examVerdict(v){S.claim=v;examPanel();}
// Each column is judged against what the student actually wrote in the columns it depends on,
// so one early mistake does not make every later column count as wrong.
function localExpect(node,si,r){
  const b=S.sents[si].base;
  if(node.k==='atom')return S['a'+S.as.indexOf(node.ch)+'|'+r];
  const a=S[(b+node.a.col)+'|'+r];
  if(a===undefined)return undefined;
  if(node.k==='not')return a===S.T?S.F:S.T;
  const c=S[(b+node.b.col)+'|'+r];
  if(c===undefined)return undefined;
  return (node.k==='and'?(a===S.T&&c===S.T):(a===S.T||c===S.T))?S.T:S.F;
}
function examSubmit(){
  const steps=[];
  if(S.nRows!==2**S.as.length)
    steps.push(`Step 1 — the number of rows. With ${S.as.length} atomic letters the table needs ${2**S.as.length} rows; you used ${S.nRows}.`);
  const got=readRows();
  if(!got)steps.push('Step 2 — the columns under the atomic letters are not completely filled in.');
  else{const first={},dup=new Set();
    got.forEach((s,r)=>{if(first[s]===undefined)first[s]=r;else{dup.add(r);dup.add(first[s]);}});
    if(dup.size){dup.forEach(r=>S.as.forEach((a,k)=>S['bada'+k+'|'+r]=1));
      steps.push(`Step 2 — the rows. ${dup.size} of them repeat a combination that appears elsewhere, so the same number of combinations are missing.`);}}
  const wrong=[];
  Object.keys(S.cols).forEach(g=>{const{node,si}=S.cols[+g];
    for(let r=0;r<R();r++){const want=localExpect(node,si,r),got2=S[g+'|'+r];
      if(want===undefined||got2===undefined){if(got2===undefined)wrong.push([+g,r,'blank']);continue;}
      if(got2!==want)wrong.push([+g,r,'wrong']);}});
  wrong.forEach(([g,r])=>S['bad'+g+'|'+r]=1);
  if(wrong.length){
    const blanks=wrong.filter(w=>w[2]==='blank').length,errs=wrong.length-blanks;
    const cols=[...new Set(wrong.filter(w=>w[2]==='wrong').map(w=>w[0]))];
    const e1=errs===1?'1 cell does not follow from the column it is built from'
      :`${errs} cells across ${cols.length} column${cols.length>1?'s':''} do not follow from the columns they are built from`;
    steps.push(`Step 3 — the columns. ${errs?e1:''}${errs&&blanks?'; ':''}`
      +`${blanks?`${blanks} cell${blanks>1?'s':''} left blank`:''}. The marked cells are the ones to look at — each is judged against what you wrote in the columns feeding it, so an early slip is not counted twice.`);}
  // the final answer is judged against the table as the student filled it
  let fin=null;
  try{
    if(kind()==='cls'){const bad=[];
      S.sents.forEach((s,i)=>{const g=$('f'+i).value;
        if(!g)bad.push(s.src+' (not answered)');else if(g!==classify(colOf(i)))bad.push(s.src);});
      if(bad.length)fin=`Step 4 — the classification is not right for: ${bad.join(', ')}.`;}
    else if(kind()==='cmp'){
      const t=trueSets(),c=covered();
      const wrongSet=S.sets.some(({kind:k,ids})=>{for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)
        if(relOf(ids[a],ids[b])!==k)return true;return false;});
      const miss=t.eq.filter(p=>!c.eq.has(p)).length+t.ex.filter(p=>!c.ex.has(p)).length;
      if(wrongSet||miss)fin='Step 4 — the relations. '+(wrongSet?'At least one set you recorded does not actually hold. ':'')
        +(miss?`${miss} relation${miss>1?'s':''} that do${miss>1?'':'es'} hold ${miss>1?'were':'was'} not identified.`:'');}
    else{const cols=S.sents.map((s,i)=>colOf(i)),n=S.sents.length-1;
      const want=new Set(premRows(cols,n)),ce=new Set(counterexamples(cols,n));
      if(S.claim===undefined)fin='Step 4 — no verdict given.';
      else if(S.claim&&ce.size)fin='Step 4 — you called it valid, but there is a row with every premise true and the conclusion false.';
      else if(!S.claim&&!ce.size)fin='Step 4 — you called it invalid, but there is no row with every premise true and the conclusion false.';
      else if(S.claim){const miss=[...want].filter(r=>!S.marked.has(r)),ex=[...S.marked].filter(r=>!want.has(r));
        if(miss.length||ex.length)fin='Step 4 — the verdict is right, but the rows marked are not exactly those in which every premise is true.';}
      else{const bad=[...S.marked].filter(r=>!ce.has(r));
        if(!S.marked.size||bad.length)fin='Step 4 — the verdict is right, but the rows marked do not all show every premise true and the conclusion false.';}}
  }catch(e){fin='Step 4 — could not read the final answer.';}
  if(fin)steps.push(fin);
  S.stage='done';draw();$('final').innerHTML='<button onclick=start()>Try it again</button>';
  if(!steps.length)return finish('Everything correct, first time, with no help. That is exam standard.');
  msg('First problem: '+steps[0]+(steps.length>1?'\n\nAlso:\n'+steps.slice(1).map(s=>'· '+s).join('\n'):''),'err');
}

function finish(t){
  S.stage='done';draw();$('final').innerHTML='<button onclick=start()>Run it again</button>';
  msg('✓  '+t+'\n\nWhole table finished, every column checked. Nicely done.','win');
}
modeChanged();
</script>
